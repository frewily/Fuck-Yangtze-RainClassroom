name: Refresh HFUT course schedule

on:
  schedule:
    - cron: "0 18 * * *"  # 02:00 Beijing time; login is skipped once this term is saved
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-schedule-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install schedule dependency
        run: |
          python -m pip install requests Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Refresh only when the semester changes
        run: python -m function.course_schedule refresh
        env:
          HFUT_USERNAME: ${{ secrets.HFUT_USERNAME }}
          HFUT_PASSWORD: ${{ secrets.HFUT_PASSWORD }}
          FILTERED_COURSES: ${{ secrets.FILTERED_COURSES }}
      - name: Generate Android calendar subscription
        run: python -m function.course_calendar
      - name: Commit minimal timetable and calendar if changed
        run: |
          if [[ -z "$(git status --porcelain -- data/course_schedule.json data/course_schedule.ics)" ]]; then
            echo "No timetable or calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/course_schedule.json data/course_schedule.ics
          git commit -m "Update minimal HFUT course schedule and calendar"
          git push
